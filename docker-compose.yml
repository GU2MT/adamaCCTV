version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adama_cctv
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/adama_cctv
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/usr/src/app:cached
      - /usr/src/app/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  db_data:
